# Prints the exact OIDC `sub` claim GitHub issues for this repository. The infrastructure repo's
# `make oidc-claims` runs this and writes the result into its project.env; trust policies are
# written against the literal captured string.
name: OIDC claim

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to run in
        type: choice
        options: [production, staging, none]
        default: production

permissions:
  id-token: write
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment != 'none' && inputs.environment || '' }}
    steps:
      - name: Print sub claim
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CLAIMS=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, repository, environment, ref}')
          echo "$CLAIMS"
          SUB=$(jq -r .sub <<<"$CLAIMS")
          echo "::notice title=OIDC sub::$SUB"
          echo "OIDC_SUB=$SUB" >> "$GITHUB_STEP_SUMMARY"
