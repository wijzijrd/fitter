<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F5F6F7;color:#1F2328;font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{background:#fff;border-bottom:1px solid #E4E6E8;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.mark{font-weight:800;font-size:19px}nav{display:flex;gap:16px;font-size:14px;color:#57606A}nav .on{color:#1F2328;font-weight:600}
h1{font-size:24px;font-weight:700;padding:16px 16px 2px}
.meta{padding:0 16px;font-size:13px;color:#57606A}
.tabs{display:flex;margin:14px 16px 0;background:#fff;border:1px solid #E4E6E8;border-radius:8px;padding:3px}
.tabs span{flex:1;text-align:center;padding:7px;font-size:14px;font-weight:600;border-radius:6px;color:#57606A}.tabs .on{background:#1F2328;color:#fff}
.card{background:#fff;border:1px solid #E4E6E8;border-radius:10px;margin:12px 16px;padding:14px}
.stat{display:flex;justify-content:space-between;align-items:baseline}
.stat b{font-size:24px}
.bar{height:8px;border-radius:4px;background:#E4E6E8;margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;background:#FF5C34}
.sub{font-size:13px;color:#57606A;margin-top:6px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:#57606A;text-align:left;font-weight:600;padding:6px 0}
td{padding:9px 0;border-top:1px solid #EEF0F2;font-size:14px}
.v{text-align:right}
tr.me td{font-weight:700}
footer{position:absolute;bottom:14px;left:16px;font-size:11px;color:#57606A}
</style></head><body>

</body></html>
