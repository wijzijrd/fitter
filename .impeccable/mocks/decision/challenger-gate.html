<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ch:#351E28;--tg:#FF5C34;--cb:#D7EFFF;--muted:#6A5A61}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:var(--ch);font:400 15px/1.4 "Hanken Grotesk",sans-serif}
.mono{font-family:"Martian Mono",monospace;font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid var(--ch)}
.mark{font:800 22px "Hanken Grotesk"}
nav{display:flex;gap:16px;font-size:14px}nav a.on{font-weight:800;text-decoration:underline;text-underline-offset:4px}
h1{font:800 30px/1 "Hanken Grotesk";padding:16px 16px 4px}
.meta{padding:0 16px;font-size:13px;color:var(--muted)}
.pass{margin:16px;border:2px solid var(--ch);border-radius:14px;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--cb)}
.seg{padding:10px 12px;border-right:2px dashed var(--ch)}.seg:last-child{border:0}
.seg small{display:block;font:700 10px "Martian Mono";letter-spacing:.06em;color:var(--muted)}
.seg b{font:700 22px "Martian Mono"}
.tabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid #ddd}
.tabs span{padding-bottom:8px;font-weight:600;color:var(--muted)}.tabs .on{color:var(--ch);border-bottom:3px solid var(--ch)}
.board{margin:12px 16px;background:var(--ch);color:#fff;border-radius:12px;padding:6px 0}
.row{display:grid;grid-template-columns:32px 1fr 74px 64px;padding:9px 12px;font-size:13px;align-items:center}
.row.h{font-size:10px;letter-spacing:.08em;opacity:.6}
.row .v,.row .m{text-align:right}
.row.lit{background:var(--tg);color:var(--ch);font-weight:700}
.row.me{outline:2px solid var(--cb);outline-offset:-2px}
.note{margin:0 16px;font-size:13px;color:var(--muted)}
footer{position:absolute;bottom:14px;left:16px;font-size:11px;color:var(--muted)}
</style></head><body>
<header><span class="mark">Fitter</span><nav><a class="on">Campaigns</a><a>Goals</a></nav></header>
<h1>October 200 km</h1><div class="meta">Per member · Distance · 6 friends</div>
<div class="pass"><div class="seg"><small>RANK</small><b class="mono">03</b></div><div class="seg"><small>TO SAM</small><b class="mono">8.2</b></div><div class="seg"><small>DAY</small><b class="mono">18/31</b></div></div>
<div class="tabs"><span class="on">Standings</span><span>Feed</span><span>Timeline</span></div>
<div class="board mono">
<div class="row h"><span>#</span><span>NAME</span><span class="v">KM</span><span class="m">MOVE</span></div>
<div class="row"><span>01</span><span>PRIYA</span><span class="v">204.1</span><span class="m">FIN</span></div>
<div class="row"><span>02</span><span>SAM</span><span class="v">142.0</span><span class="m">—</span></div>
<div class="row me"><span>03</span><span>YOU</span><span class="v">133.8</span><span class="m">—</span></div>
<div class="row lit"><span>04</span><span>JONNO</span><span class="v">97.5</span><span class="m">▲2</span></div>
<div class="row"><span>05</span><span>LERATO</span><span class="v">61.2</span><span class="m">▼1</span></div>
<div class="row"><span>06</span><span>MIKA</span><span class="v">22.0</span><span class="m">▼1</span></div>
</div>
<p class="note">Jonno moved up 2 after a 31 km ride this morning.</p>
<footer>Powered by Strava</footer>
</body></html>
