<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ch:#351E28;--tg:#FF5C34;--cb:#D7EFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ch);color:#fff;font:500 15px/1.35 "Red Hat Display",sans-serif}
.num{font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.mark{font:900 20px "Red Hat Display";letter-spacing:-.02em}
nav{display:flex;gap:16px;font-size:14px}nav a{opacity:.6}nav a.on{opacity:1;font-weight:700}
h1{font:300 72px/0.9 "Red Hat Display";letter-spacing:-.04em;white-space:nowrap;padding:6px 0 0 14px;margin-right:-200px}
.meta{padding:6px 16px 0;font-size:13px;opacity:.7}
.tabs{display:flex;gap:22px;padding:14px 16px 0}
.tabs span{font-size:16px;opacity:.55;padding-bottom:6px}.tabs .on{opacity:1;font-weight:700;border-bottom:3px solid var(--tg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px}
.t{height:120px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.t small{font-size:13px;font-weight:700}
.t b{font:900 56px/0.85 "Red Hat Display";letter-spacing:-.04em}
.t.r{background:var(--tg);color:var(--ch)}
.t.g{background:var(--cb);color:var(--ch)}
.t.d{background:#fff;color:var(--ch)}
.t.live{background:#5A3746;color:#fff}
.t.live b{font-size:28px;line-height:1}
.t b span{font-size:22px;font-weight:500;letter-spacing:0}
ol{list-style:none;padding:4px 16px}
li{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:12px;padding:7px 0}
li .r{font-weight:900;letter-spacing:-.03em;width:40px}
li .n{font-size:16px}
li .v{font-weight:700}
li.me .n{color:var(--tg);font-weight:900}
.s1{font-size:34px}.s2{font-size:28px}.s3{font-size:24px}.s4,.s5,.s6{font-size:20px;opacity:.75}
.stamp{font-size:11px;font-weight:900;letter-spacing:.08em;border:2px solid var(--cb);color:var(--cb);padding:1px 5px;margin-left:8px;vertical-align:middle}
footer{position:absolute;bottom:14px;left:16px;font-size:11px;opacity:.6}
</style></head><body>
<header><span class="mark">fitter</span><nav><a class="on">Campaigns</a><a>Goals</a></nav></header>
<h1>october 200 km</h1>
<div class="meta num">Per member · Distance · 6 friends</div>
<div class="tabs"><span class="on">Standings</span><span>Feed</span><span>Timeline</span></div>
<div class="tiles num">
  <div class="t r"><small>Your rank</small><b>3<span>rd</span></b></div>
  <div class="t g"><small>To catch Sam</small><b>8.2<span> km</span></b></div>
  <div class="t d"><small>Days left</small><b>13</b></div>
  <div class="t live"><small>Sam · 2 h ago</small><b>ran 10.4 km</b></div>
</div>
<ol class="num">
  <li><span class="r s1">1</span><span class="n">Priya<span class="stamp">FINISHED</span></span><span class="v">204.1</span></li>
  <li><span class="r s2">2</span><span class="n">Sam</span><span class="v">142.0</span></li>
  <li class="me"><span class="r s3">3</span><span class="n">You</span><span class="v">133.8</span></li>
  <li><span class="r s4">4</span><span class="n">Jonno</span><span class="v">97.5</span></li>
  <li><span class="r s5">5</span><span class="n">Lerato</span><span class="v">61.2</span></li>
</ol>
<footer>Powered by Strava</footer>
</body></html>
