<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--avo:#A9A23C;--ground:#F6F0E6;--aub:#2B0A2E;--rust:#B4552D}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--aub);font:700 15px/1.3 "Schibsted Grotesk",sans-serif;position:relative}
.num{font-variant-numeric:tabular-nums}
svg.lobe{position:absolute;top:0;left:0}
header{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.mark{font-size:22px;letter-spacing:-.04em}nav{display:flex;gap:16px;font-size:14px}nav a{opacity:.65}nav a.on{opacity:1}
.hero{position:relative;padding:14px 16px 0}
h1{font-size:44px;line-height:.95;letter-spacing:-.06em}
.you{margin-top:14px;font-size:15px}
.you b{display:block;font-size:56px;line-height:.95;letter-spacing:-.06em}
.caps{position:relative;display:flex;gap:8px;padding:56px 16px 0}
.cap{border-radius:999px;padding:8px 16px;background:#fff;font-size:14px}.cap.on{background:var(--aub);color:var(--ground)}
ol{position:relative;list-style:none;padding:12px 16px}
li{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:999px;padding:6px 6px 6px 16px;margin-bottom:8px}
li .who{display:flex;gap:10px;align-items:baseline}
li .r{opacity:.5}
li .pill{display:flex;align-items:center;gap:8px;background:var(--rust);color:#fff;border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
li .chip{width:18px;height:18px;border-radius:50%;background:#fff}
li .pill.idle{background:#E8DFD2;color:var(--aub);flex-direction:row-reverse;padding:5px 12px 5px 6px}
li .pill.idle .chip{background:var(--aub);opacity:.3}
li.me{outline:3px solid var(--aub)}
footer{position:absolute;bottom:14px;left:16px;font-size:11px;opacity:.6}
</style></head><body>
<svg class="lobe" width="390" height="380" viewBox="0 0 390 380"><path d="M0 0 H390 V250 C350 330 250 300 200 340 C140 390 60 330 0 350 Z" fill="#A9A23C"/></svg>
<header><span class="mark">fitter</span><nav><a class="on">Campaigns</a><a>Goals</a></nav></header>
<div class="hero num"><h1>October<br>200 km</h1><div class="you"><b>133.8 km</b>You're 3rd · 8.2 km behind Sam</div></div>
<div class="caps"><span class="cap on">Standings</span><span class="cap">Feed</span><span class="cap">Timeline</span></div>
<ol class="num">
  <li><span class="who"><span class="r">1</span>Priya</span><span class="pill">204.1 finished<span class="chip"></span></span></li>
  <li><span class="who"><span class="r">2</span>Sam</span><span class="pill">142.0 active today<span class="chip"></span></span></li>
  <li class="me"><span class="who"><span class="r">3</span>You</span><span class="pill idle">133.8<span class="chip"></span></span></li>
  <li><span class="who"><span class="r">4</span>Jonno</span><span class="pill">97.5 active today<span class="chip"></span></span></li>
  <li><span class="who"><span class="r">5</span>Lerato</span><span class="pill idle">61.2<span class="chip"></span></span></li>
</ol>
<footer>Powered by Strava</footer>
</body></html>
