<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#351e28;--muted:#5a4a52;--t:#ff5c34;--b:#d7efff;--h:#e9e2e6}
*{box-sizing:border-box}html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--ink);font-family:"Hanken Grotesk",sans-serif}
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--ink)}
.wm{font-family:Bungee;font-size:20px}.nav span{font-weight:600;color:var(--muted);margin-left:14px}.nav .on{color:var(--ink);text-decoration:underline 3px var(--t);text-underline-offset:6px}
.pill{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;background:#fff}.pri{background:var(--t)}
.head{display:flex;justify-content:space-between;align-items:center;padding:20px 16px 14px}
h1{margin:0;font:400 26px Bungee}h2{margin:0 16px 10px;font:400 16px Bungee}
.bib{margin:0 16px 18px;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.band{display:flex;justify-content:space-between;background:var(--t);padding:4px 12px;font:400 12px Bungee}
.main{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 14px 8px;min-height:112px}
.num{font:400 80px/0.85 Bungee}.num.l{font-size:58px}
.val{text-align:right}.val b{display:block;font:400 26px Bungee}.val small{display:block;color:var(--muted);font-size:13px}
.tab{border-top:2px dashed var(--ink);background:var(--b);padding:8px 14px;font-weight:700;font-size:15px}
</style></head><body>
<div class="nav"><span class="wm" style="margin:0;color:var(--ink)">FITTER</span><div><span class="on">Campaigns</span><span>Goals</span></div></div>
<div class="head"><h1>CAMPAIGNS</h1><span class="pill pri">New campaign</span></div>
<h2>RACING</h2>
<div class="bib"><div class="band"><span>OCTOBER CLIMB</span><span>14 DAYS LEFT</span></div>
<div class="main"><span class="num">3</span><span class="val"><b>3,420 M</b><small>6 racing</small><small>1,580 m to go</small></span></div>
<div class="tab">470 m to catch Sam</div></div>
<div class="bib"><div class="band"><span>LUNCH RUN CLUB</span><span>18 DAYS LEFT</span></div>
<div class="main"><span class="num">1</span><span class="val"><b>62.3 KM</b><small>4 racing</small><small>37.7 km to go</small></span></div>
<div class="tab">8.2 km clear of Sam</div></div>
<div class="bib"><div class="band"><span>CREW TO CAPE POINT</span><span>44 DAYS LEFT</span></div>
<div class="main"><span class="num l">64%</span><span class="val"><b>964.0 KM</b><small>of 1,500.0 km</small></span></div>
<div class="tab">You: 212.0 km · 22% of the total</div></div>
</body></html>
