<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ch:#351E28;--tg:#FF5C34;--cb:#D7EFFF;--muted:#5E4A53}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--cb);color:var(--ch);font:400 15px/1.4 Figtree,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{background:var(--ch);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.mark{font:900 22px/1 Anybody;font-stretch:130%;letter-spacing:.01em;text-transform:uppercase}
nav{display:flex;gap:16px;font-size:14px}nav a{opacity:.7}nav a.on{opacity:1;font-weight:700}
.head{padding:16px}
.stage{font:700 12px Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:900 36px/0.95 Anybody;font-stretch:75%;text-transform:uppercase;margin-top:4px}
.tabs{display:flex;gap:8px;padding:0 16px}
.tabs span{padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;background:#fff}
.tabs .on{background:var(--ch);color:#fff}
.band{margin:14px 16px;background:var(--tg);color:var(--ch);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.band .pos{font:900 44px/1 Anybody;font-stretch:70%}
.band .gap{text-align:right;font-weight:700}
.band .gap b{display:block;font:900 26px/1 Anybody;font-stretch:80%}
.profile{margin:0 16px;background:#fff;border-radius:12px;padding:10px 12px}
.profile .lbl{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
table{width:calc(100% - 32px);margin:12px 16px;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px}
td{padding:9px 12px;border-top:1px solid #E3EEF6;font-size:14px}
td.r{width:28px;font:800 16px Anybody;font-stretch:80%}
td.v,th.v{text-align:right}
.jer{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--tg);margin-right:6px}
tr.me td{background:#FFF1EC;font-weight:700}
footer{position:absolute;bottom:14px;left:16px;font-size:11px;color:var(--muted)}
</style></head><body>
<header><span class="mark">Fitter</span><nav><a class="on">Campaigns</a><a>Goals</a></nav></header>
<div class="head"><div class="stage num">Stage 18 of 31 · per member · distance</div><h1>October 200 km</h1></div>
<div class="tabs"><span class="on">Classification</span><span>Feed</span><span>Profile</span></div>
<div class="band"><div><div class="pos num">3RD</div><div style="font-weight:700">You · 133.8 km</div></div><div class="gap num">to Sam<b>+8.2 km</b></div></div>
<div class="profile"><div class="lbl"><span>Group profile</span><span class="num">200 km</span></div>
<svg viewBox="0 0 340 80" width="100%" height="80"><path d="M0 80 L0 70 L40 62 L80 55 L120 44 L160 40 L200 30 L230 22 L230 80Z" fill="#351E28"/><line x1="0" y1="8" x2="340" y2="8" stroke="#351E28" stroke-dasharray="4 4" opacity=".4"/><circle cx="230" cy="34" r="6" fill="#FF5C34" stroke="#351E28" stroke-width="2"/></svg></div>
<table class="num"><tr><th>#</th><th>Rider</th><th class="v">km</th><th class="v">Gap</th></tr>
<tr><td class="r">1</td><td><span class="jer"></span>Priya</td><td class="v">204.1</td><td class="v">—</td></tr>
<tr><td class="r">2</td><td>Sam</td><td class="v">142.0</td><td class="v">+62.1</td></tr>
<tr class="me"><td class="r">3</td><td>You</td><td class="v">133.8</td><td class="v">+70.3</td></tr>
<tr><td class="r">4</td><td>Jonno</td><td class="v">97.5</td><td class="v">+106.6</td></tr>
<tr><td class="r">5</td><td>Lerato</td><td class="v">61.2</td><td class="v">+142.9</td></tr>
<tr><td class="r">6</td><td>Mika</td><td class="v">22.0</td><td class="v">+182.1</td></tr></table>
<footer>Powered by Strava</footer>
</body></html>
