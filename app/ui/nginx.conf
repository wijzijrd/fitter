server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # docker-compose deploy only. The S3 + CloudFront deploy has no nginx: its SPA
    # fallback turns a stale chunk into index.html, and router.onError reloads once.
    # A stale hashed chunk must 404, not fall back to index.html as a 200 the
    # browser rejects as the wrong MIME type.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
