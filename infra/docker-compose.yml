services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fitter
      POSTGRES_PASSWORD: fitter
      POSTGRES_DB: fitter
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitter -d fitter"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  svc:
    build:
      context: app/svc
    image: fitter-svc
    environment:
      PORT: 8081
      # Locally one superuser serves both roles. In a deployed environment these are
      # distinct DSNs from the secret store: the migration URL is the admin user, the
      # serving URL is the restricted role over a transaction-mode pooler.
      DATABASE_URL: postgres://fitter:fitter@postgres:5432/fitter?sslmode=disable
      DATABASE_MIGRATION_URL: postgres://fitter:fitter@postgres:5432/fitter?sslmode=disable
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CORS_ORIGIN: ${FRONTEND_URL}
      ADMIN_STRAVA_ATHLETE_IDS: ${ADMIN_STRAVA_ATHLETE_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: app/ui
      args:
        VITE_API_BASE_URL: ${PUBLIC_BASE_URL}
    image: fitter-ui
    ports:
      - "8080:80"
    depends_on:
      - svc
    restart: unless-stopped

volumes:
  pg-data:
