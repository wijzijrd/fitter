syntax = "proto3";

package fitter.v1;

import "fitter/v1/exercise.proto";
import "google/protobuf/timestamp.proto";

// AdminService manages the custom-sport/custom-metric taxonomy an admin can
// add on top of internal/sports and internal/metrics' built-in ones (see
// CatalogService.ListMetrics/ListSports, which merge these in). Every RPC
// here is gated by requireAdmin server-side; the frontend's own admin-route
// gate is a UX convenience only, never the real security boundary.
message CustomSport {
  string id = 1;
  string key = 2; // validated at creation: must not collide with any real Strava sport_type
  string label = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CustomMetric {
  string id = 1;
  string key = 2; // validated at creation: must not collide with a built-in metrics.Key or an existing custom key
  string label = 3;
  string unit = 4; // free-text display unit, e.g. "kg", "reps"
  string aggregation = 5; // "sum" | "average" | "max" | "count"
  bool nullable = 6;
  bool lower_is_better = 7;
  bool supports_single_scope = 8;
  bool supports_aggregate_scope = 9;
  // Sport groups (curated built-in group keys, e.g. "strength") and/or
  // custom sport keys this metric is meaningful for. Empty = applies to
  // every sport, matching CatalogService.MetricInfo.applicable_sport_groups'
  // empty-means-unrestricted convention.
  repeated string applicable_sport_refs = 10;
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
}

message CreateCustomSportRequest {
  string key = 1;
  string label = 2;
}

message CreateCustomSportResponse {
  CustomSport sport = 1;
}

message ListCustomSportsRequest {}

message ListCustomSportsResponse {
  repeated CustomSport sports = 1;
}

message DeleteCustomSportRequest {
  string id = 1;
}

message DeleteCustomSportResponse {}

message CreateCustomMetricRequest {
  string key = 1;
  string label = 2;
  string unit = 3;
  string aggregation = 4; // "sum" | "average" | "max" | "count"
  bool nullable = 5;
  bool lower_is_better = 6;
  bool supports_single_scope = 7;
  bool supports_aggregate_scope = 8;
  repeated string applicable_sport_refs = 9;
}

message CreateCustomMetricResponse {
  CustomMetric metric = 1;
}

message ListCustomMetricsRequest {}

message ListCustomMetricsResponse {
  repeated CustomMetric metrics = 1;
}

message DeleteCustomMetricRequest {
  string id = 1;
}

message DeleteCustomMetricResponse {}

message AdminUser {
  string id = 1;
  string name = 2;
  string avatar_url = 3;
  int64 strava_athlete_id = 4;
  string role = 5;
  string status = 6;
  string ban_reason = 7;
  string banned_by = 8;
  google.protobuf.Timestamp banned_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message AdminAction {
  string id = 1;
  string actor_id = 2;
  string actor_name = 3;
  string action = 4;
  string target_id = 5;
  string detail = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListUsersRequest {
  string status = 1; // empty = all
}
message ListUsersResponse {
  repeated AdminUser users = 1;
}
message ApproveUserRequest {
  string id = 1;
}
message ApproveUserResponse {}
message BanUserRequest {
  string id = 1;
  string reason = 2; // required, max 500 chars
}
message BanUserResponse {}
message UnbanUserRequest {
  string id = 1;
}
message UnbanUserResponse {}
message SetUserRoleRequest {
  string id = 1;
  string role = 2; // "member" | "admin"
}
message SetUserRoleResponse {}
message ListAdminActionsRequest {
  int32 limit = 1; // default 100, max 500
}
message ListAdminActionsResponse {
  repeated AdminAction actions = 1;
}

message UpdateExerciseRequest {
  string id = 1;
  string name = 2;
  ExerciseMeasure measure = 3; // may differ from the stored one only while the exercise is unused
  bool loaded = 4;
  repeated Muscle muscles = 5;
}
message UpdateExerciseResponse {
  Exercise exercise = 1;
}
message DeleteExerciseRequest {
  string id = 1; // refused while any station uses it; merge instead
}
message DeleteExerciseResponse {}
// MergeExercisesRequest moves every station, goal clause and legacy lift from
// source to target, then removes source.
message MergeExercisesRequest {
  string source_id = 1;
  string target_id = 2;
}
message MergeExercisesResponse {
  Exercise exercise = 1; // the target
}

service AdminService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ApproveUser(ApproveUserRequest) returns (ApproveUserResponse);
  rpc BanUser(BanUserRequest) returns (BanUserResponse);
  rpc UnbanUser(UnbanUserRequest) returns (UnbanUserResponse);
  rpc SetUserRole(SetUserRoleRequest) returns (SetUserRoleResponse);
  rpc ListAdminActions(ListAdminActionsRequest) returns (ListAdminActionsResponse);
  rpc CreateCustomSport(CreateCustomSportRequest) returns (CreateCustomSportResponse);
  rpc ListCustomSports(ListCustomSportsRequest) returns (ListCustomSportsResponse);
  rpc DeleteCustomSport(DeleteCustomSportRequest) returns (DeleteCustomSportResponse);
  rpc CreateCustomMetric(CreateCustomMetricRequest) returns (CreateCustomMetricResponse);
  rpc ListCustomMetrics(ListCustomMetricsRequest) returns (ListCustomMetricsResponse);
  rpc DeleteCustomMetric(DeleteCustomMetricRequest) returns (DeleteCustomMetricResponse);
  rpc UpdateExercise(UpdateExerciseRequest) returns (UpdateExerciseResponse);
  rpc DeleteExercise(DeleteExerciseRequest) returns (DeleteExerciseResponse);
  rpc MergeExercises(MergeExercisesRequest) returns (MergeExercisesResponse);
}
